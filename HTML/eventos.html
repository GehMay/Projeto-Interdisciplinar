<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TrocaTicket - Eventos</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <main class="container">
        <!-- Banner -->
        <section class="banner">
            <h1 class="titulo_pagina">Descubra os Melhores Eventos</h1>
            <p class="subtitulo_pagina">Explore shows, esportes e muito mais!</p>
            <a href="login.html" class="btn">Acesse sua Conta</a>
        </section>

        <!-- Seção de Eventos -->
        <section class="eventos">
            <h2>Eventos em Destaque</h2>
            <div class="cards-grid">
                <article class="card">
                    <div class="card-banner">
                        <img src="assets/images/evento1.jpg" alt="Evento 1">
                    </div>
                    <div class="card-body">
                        <h3>Show do Artista X</h3>
                        <p>Data: 25/11/2023</p>
                        <p>Local: São Paulo</p>
                    </div>
                </article>
                <article class="card">
                    <div class="card-banner">
                        <img src="assets/images/evento2.jpg" alt="Evento 2">
                    </div>
                    <div class="card-body">
                        <h3>Jogo de Futebol</h3>
                        <p>Data: 30/11/2023</p>
                        <p>Local: Rio de Janeiro</p>
                    </div>
                </article>
                <article class="card">
                    <div class="card-banner">
                        <img src="assets/images/evento3.jpg" alt="Evento 3">
                    </div>
                    <div class="card-body">
                        <h3>Peça de Teatro</h3>
                        <p>Data: 10/12/2023</p>
                        <p>Local: Belo Horizonte</p>
                    </div>
                </article>
            </div>
        </section>
    </main>
